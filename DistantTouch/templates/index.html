<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111827"> 
    <title>Distant Touch</title>

    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiRGlzdGFudCBUb3VjaCIsInNob3J0X25hbWUiOiJUb3VjaCIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMTExODI3IiwidGhlbWVfY29sb3IiOiIjMTExODI3IiwiaWNvbnMiOlt7InNyYyI6Imh0dHBzOi8vcGxhY2Vob2xkLmNvLzE5MngxOTIvZWM0ODk5L2ZmZmZmZj90ZXh0PURUIiwic2l6ZXMiOiIxOTJ4MTkyIiwidHlwZSI6ImltYWdlL3BuZyJ9LHsic3JjIjoiaHR0cHM6Ly9wbGFjZWhvbGQuY28vNTEyeDUxMi9lYzQ4OTkvZmZmZmZmP3RleHQ9RFQiLCJzaXplcyI6IjUxMng1MTIiLCJ0eXBlIjoiaW1hZ2UvcG5nIn1dfQ==">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        :root {
            --theme-color-1: #3b82f6; /* Default Blue */
            --theme-color-2: #1d4ed8; 
            --theme-glow: rgba(59, 130, 246, 0.5);
        }

        body {
            overscroll-behavior-y: none; 
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #111827; 
        }

        .btn-glow {
            box-shadow: 0 0 25px var(--theme-glow), 0 0 50px var(--theme-glow);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: linear-gradient(135deg, var(--theme-color-1) 0%, var(--theme-color-2) 100%);
        }

        .btn-glow:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .btn-glow:active {
            transform: translateY(2px) scale(0.95);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 1; transform: translateY(-20px) scale(1.2) rotate(-10deg); }
            100% { transform: translateY(-100vh) scale(1.5) rotate(25deg); opacity: 0; }
        }

        .floating-heart {
            position: absolute;
            bottom: 30%;
            left: 50%;
            font-size: 2.5rem;
            pointer-events: none;
            animation: floatUp 4s ease-in forwards;
            z-index: 50;
            user-select: none;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .status-pulse {
            animation: pulse-dot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="text-white h-screen w-screen flex flex-col items-center justify-center relative select-none">

    <div class="absolute top-12 flex flex-col items-center gap-2 w-full px-6">
        <div class="bg-gray-800/80 backdrop-blur-sm border border-gray-700 rounded-full px-4 py-2 flex items-center gap-3 shadow-lg">
            <div id="statusDot" class="w-3 h-3 rounded-full bg-yellow-400 status-pulse"></div>
            <span id="statusText" class="text-sm font-medium text-gray-300 tracking-wide">Connecting...</span>
        </div>
        <div id="partnerStatus" class="text-xs text-gray-500 opacity-0 transition-opacity duration-500 text-center">
            <!-- Text injected by JS -->
        </div>
    </div>

    <div class="relative z-10 flex flex-col items-center mt-10">
        <div class="mb-8 opacity-80 transition-transform duration-200" id="mainHeart" style="color: var(--theme-color-1)">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" style="filter: drop-shadow(0 0 15px var(--theme-glow));" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <button id="touchButton" class="btn-glow text-white font-bold text-xl px-12 py-5 rounded-full uppercase tracking-widest focus:outline-none flex items-center gap-3">
            <span><!-- Text injected by JS --></span>
        </button>
    </div>

    <div id="heartContainer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <script>
        // --- Theme & Pronoun Logic ---
        const urlParams = new URLSearchParams(window.location.search);
        const isHer = urlParams.get('u') === 'her';

        // Set exact pronouns based on who is looking at the screen
        const targetPronoun = isHer ? "Him" : "Her";
        const targetPronounLower = isHer ? "him" : "her";

        if (isHer) {
            // Her screen gets the Pink theme
            document.documentElement.style.setProperty('--theme-color-1', '#ec4899');
            document.documentElement.style.setProperty('--theme-color-2', '#be185d');
            document.documentElement.style.setProperty('--theme-glow', 'rgba(236, 72, 153, 0.5)');
        }

        // --- UI Elements ---
        const touchButton = document.getElementById('touchButton');
        const touchButtonText = touchButton.querySelector('span');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const partnerStatus = document.getElementById('partnerStatus');
        const heartContainer = document.getElementById('heartContainer');
        const mainHeart = document.getElementById('mainHeart');

        // Apply starting text
        touchButtonText.innerText = `Notify ${targetPronoun}`;

        // --- Audio Setup ---
        const synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.05, decay: 0.3, sustain: 0.1, release: 1.5 }
        }).toDestination();
        synth.volume.value = -10; 

        // --- WebSocket Connection ---
        const socket = io();

        socket.on('connect', () => {
            statusText.innerText = "Connected";
            statusDot.className = "w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]";
            partnerStatus.classList.remove('opacity-0');
            partnerStatus.innerText = `Thinking of ${targetPronounLower}?`;
        });

        socket.on('disconnect', () => {
            statusText.innerText = "Offline";
            statusDot.className = "w-3 h-3 rounded-full bg-red-500 status-pulse";
            partnerStatus.innerText = "Connection lost. Reconnecting...";
        });

        // --- Receive Touch ---
        socket.on('receive_touch', async () => {
            if (Tone.context.state !== 'running') await Tone.start();
            const now = Tone.now();
            synth.triggerAttackRelease("G4", 1.5, now);
            synth.triggerAttackRelease("C5", 1.5, now + 0.15);
            synth.triggerAttackRelease("E5", 1.5, now + 0.3);

            mainHeart.style.transform = 'scale(1.3)';
            setTimeout(() => { mainHeart.style.transform = 'scale(1)'; }, 250);

            for (let i = 0; i < 6; i++) {
                setTimeout(createFloatingHeart, i * 120);
            }
            
            partnerStatus.innerText = "You received love! 💖";
            
            // Fixed the hardcoded pronoun here!
            setTimeout(() => {
                partnerStatus.innerText = `Thinking of ${targetPronounLower}? Why don't you notify ${targetPronounLower}?`;
            }, 4000);
        });

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.innerText = isHer ? '💙' : '💖'; // Sends blue hearts to her, pink hearts to him
            heart.classList.add('floating-heart');
            
            const randomOffset = (Math.random() - 0.5) * 180; 
            const randomScale = 0.7 + Math.random() * 0.6;
            const randomDuration = 3 + Math.random() * 2.5;

            heart.style.left = `calc(50% + ${randomOffset}px)`;
            heart.style.transform = `scale(${randomScale})`;
            heart.style.animationDuration = `${randomDuration}s`;

            heartContainer.appendChild(heart);
            setTimeout(() => heart.remove(), randomDuration * 1000);
        }

        // --- Send Touch ---
        touchButton.addEventListener('click', async () => {
            if (Tone.context.state !== 'running') await Tone.start();
            const now = Tone.now();
            synth.triggerAttackRelease("G4", 1.5, now);
            synth.triggerAttackRelease("C5", 1.5, now + 0.15);
            synth.triggerAttackRelease("E5", 1.5, now + 0.3);

            mainHeart.style.transform = 'scale(1.3)';
            setTimeout(() => { mainHeart.style.transform = 'scale(1)'; }, 250);

            for (let i = 0; i < 6; i++) {
                setTimeout(createFloatingHeart, i * 120);
            }

            socket.emit('send_touch', { data: `Notify ${targetPronoun}` });

            statusText.innerText = "Sending love...";
            statusDot.className = "w-3 h-3 rounded-full bg-pink-400";
            partnerStatus.innerText = "Signal transmitting across the miles...";
            
            setTimeout(() => {
                statusText.innerText = "Connected";
                statusDot.className = "w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]";
                partnerStatus.innerText = "Your feelings have been notified! ✨";
                
                // Fixed the hardcoded pronoun here too!
                setTimeout(() => {
                    partnerStatus.innerText = `Do you want to notify ${targetPronounLower} again?`;
                }, 4000);
            }, 1500);
        });
    </script>
</body>
</html>
